<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>📚 Library Book Finder</h1>
        <p>Find your next great read</p>
    </header>

    <main>
        <section class="search">
            <input id="searchInput" type="text"
                   placeholder="Search by title, author, or category..."
                   aria-label="Search books">
            <button id="searchButton">Search</button>
        </section>

        <p id="resultCount" aria-live="polite"></p>
        <section id="bookList" class="book-grid">
            {% for book in books %}
            <article class="book-card">
                <span class="category">{{ book.category }}</span>
                <h2>{{ book.title }}</h2>
                <p>By {{ book.author }}</p>
            </article>
            {% endfor %}
        </section>
    </main>

    <footer>
        <p>Library Book Finder · Built with Python and Flask</p>
    </footer>

    <script>
        const input = document.getElementById("searchInput");
        const button = document.getElementById("searchButton");
        const list = document.getElementById("bookList");
        const count = document.getElementById("resultCount");

        function renderBooks(books) {
            list.replaceChildren();

            books.forEach(book => {
                const card = document.createElement("article");
                card.className = "book-card";

                const category = document.createElement("span");
                category.className = "category";
                category.textContent = book.category;

                const title = document.createElement("h2");
                title.textContent = book.title;

                const author = document.createElement("p");
                author.textContent = `By ${book.author}`;

                card.append(category, title, author);
                list.appendChild(card);
            });

            count.textContent = `${books.length} book(s) found`;
            if (!books.length) {
                list.textContent = "No books found. Try another search.";
            }
        }

        async function searchBooks() {
            try {
                const response = await fetch(
                    `/api/books?q=${encodeURIComponent(input.value)}`
                );
                if (!response.ok) throw new Error("Search failed");
                renderBooks(await response.json());
            } catch {
                count.textContent = "Unable to search books. Please try again.";
            }
        }

        button.addEventListener("click", searchBooks);
        input.addEventListener("keydown", event => {
            if (event.key === "Enter") searchBooks();
        });

        count.textContent = `${list.children.length} book(s) available`;
    </script>
</body>
</html>
